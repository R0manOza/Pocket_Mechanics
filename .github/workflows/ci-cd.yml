name: CI/CD

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect Deployment Scope
    runs-on: ubuntu-latest

    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      backend_ci: ${{ steps.scope.outputs.backend_ci }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'Frontend/**'
            backend:
              - 'Backend/**'
              - 'api/**'
              - 'requirements.txt'
            backend_ci:
              - 'Backend/**'
              - 'api/**'
              - 'requirements.txt'
              - 'pytest.ini'
              - 'tests/**'

      - name: Set deployment scope
        id: scope
        env:
          FRONTEND_CHANGED: ${{ steps.filter.outputs.frontend }}
          BACKEND_CHANGED: ${{ steps.filter.outputs.backend }}
          BACKEND_CI_CHANGED: ${{ steps.filter.outputs.backend_ci }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "backend_ci=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=${FRONTEND_CHANGED}" >> "$GITHUB_OUTPUT"
            echo "backend=${BACKEND_CHANGED}" >> "$GITHUB_OUTPUT"
            echo "backend_ci=${BACKEND_CI_CHANGED}" >> "$GITHUB_OUTPUT"
          fi

      - name: Report scope
        run: |
          echo "Frontend deployment scope: ${{ steps.scope.outputs.frontend }}"
          echo "Backend deployment scope: ${{ steps.scope.outputs.backend }}"
          echo "Backend CI scope: ${{ steps.scope.outputs.backend_ci }}"

  frontend-ci:
    name: Frontend Lint and Build
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    needs: changes

    defaults:
      run:
        working-directory: Frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist
          retention-days: 7

  backend-test:
    name: Run Backend Tests With Coverage
    if: needs.changes.outputs.backend_ci == 'true'
    runs-on: ubuntu-latest
    needs: changes

    env:
      OPENROUTER_KEY: test-openrouter-key
      GEMINI_API_KEY: test-gemini-key
      DEFAULT_MODEL: google/gemini-2.5-flash
      GEMINI_MODEL: gemini-2.5-flash
      USE_DIRECT_GEMINI: "false"
      COST_LOG_PATH: /tmp/cost-log.csv
      EPISODE_LOG_PATH: /tmp/episode-log.csv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=Backend \
            --cov=api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  backend-build:
    name: Validate Backend Build
    if: needs.changes.outputs.backend == 'true' && needs['backend-test'].result == 'success'
    runs-on: ubuntu-latest
    needs: [changes, backend-test]

    env:
      OPENROUTER_KEY: test-openrouter-key
      GEMINI_API_KEY: test-gemini-key
      DEFAULT_MODEL: google/gemini-2.5-flash
      GEMINI_MODEL: gemini-2.5-flash
      USE_DIRECT_GEMINI: "false"
      COST_LOG_PATH: /tmp/cost-log.csv
      EPISODE_LOG_PATH: /tmp/episode-log.csv

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install backend dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate FastAPI app import
        run: python -c "from api.index import app; print('FastAPI app imported successfully')"

      - name: Validate Render deployment inputs
        run: |
          test -f Backend/main.py
          test -f api/index.py
          test -f requirements.txt
          echo "Render deployment files are present"

      - name: Create backend build artifact
        run: |
          mkdir build-artifacts
          cp -r api build-artifacts/api
          cp -r Backend build-artifacts/Backend
          cp requirements.txt build-artifacts/requirements.txt
          cp pytest.ini build-artifacts/pytest.ini

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-artifacts
          path: build-artifacts
          retention-days: 7

  deploy-frontend:
    name: Blue-Green Frontend Deploy to Vercel
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    needs: [changes, frontend-ci]

    concurrency:
      group: frontend-production
      cancel-in-progress: false

    environment:
      name: frontend-production

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_PRODUCTION_DOMAIN: ${{ secrets.VERCEL_PRODUCTION_DOMAIN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: Frontend
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist

      - name: Prepare prebuilt output structure
        run: |
          mkdir -p .vercel/output/static
          cp -r Frontend/dist/. .vercel/output/static/
          cat > .vercel/output/config.json <<'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "/(.*)", "dest": "/index.html" }
            ]
          }
          EOF

      - name: Deploy green Vercel candidate
        id: deploy
        run: |
          set -o pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)"
          echo "deployment_url=${deployment_url}" >> "$GITHUB_OUTPUT"
          echo "Staged frontend candidate: ${deployment_url}"

      - name: Verify green Vercel candidate
        run: |
          deployment_url="${{ steps.deploy.outputs.deployment_url }}"
          curl_args=(--fail --silent --show-error --retry 5 --retry-delay 5)

          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
            curl "${curl_args[@]}" "$deployment_url" > /dev/null
          else
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not set; verifying protected preview with vercel inspect."
            vercel inspect "$deployment_url" --token="$VERCEL_TOKEN" > /dev/null
          fi

      - name: Promote green candidate to production alias
        run: |
          if [ -z "$VERCEL_PRODUCTION_DOMAIN" ]; then
            echo "VERCEL_PRODUCTION_DOMAIN is required for blue-green alias promotion."
            exit 1
          fi

          vercel alias set \
            "${{ steps.deploy.outputs.deployment_url }}" \
            "$VERCEL_PRODUCTION_DOMAIN" \
            --token="$VERCEL_TOKEN"

      - name: Verify frontend production alias
        run: |
          curl_args=(--fail --silent --show-error --retry 5 --retry-delay 5)

          if [ -n "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]; then
            curl_args+=(-H "x-vercel-protection-bypass: ${VERCEL_AUTOMATION_BYPASS_SECRET}")
          fi

          curl "${curl_args[@]}" "https://${VERCEL_PRODUCTION_DOMAIN}" > /dev/null

      - name: Rollback guidance
        if: failure()
        run: |
          echo "Frontend deployment failed before promotion or verification."
          echo "Production remains on the previous Vercel alias unless the promote step already succeeded."
          echo "Use the Vercel dashboard or vercel alias/rollback commands to restore a previous deployment if needed."

  deploy-backend:
    name: Blue-Green Backend Deploy to Render
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    needs: [changes, backend-build]

    concurrency:
      group: backend-production
      cancel-in-progress: false

    environment:
      name: backend-production

    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}

    steps:
      - name: Trigger Render zero-downtime deploy
        id: deploy
        run: |
          response="$(
            curl --fail --silent --show-error \
              --request POST \
              --header "authorization: Bearer ${RENDER_API_KEY}" \
              --header "accept: application/json" \
              --header "content-type: application/json" \
              --data "{\"clearCache\":\"do_not_clear\",\"commitId\":\"${GITHUB_SHA}\"}" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"
          )"

          deploy_id="$(echo "$response" | jq -r '.id // .deploy.id // .deployId // empty')"
          if [ -z "$deploy_id" ]; then
            echo "Render did not return a deploy id."
            echo "$response"
            exit 1
          fi

          echo "deploy_id=${deploy_id}" >> "$GITHUB_OUTPUT"
          echo "Triggered Render deploy: ${deploy_id}"

      - name: Wait for Render deploy to become live
        run: |
          success_statuses=" live "
          failure_statuses=" build_failed update_failed canceled pre_deploy_failed deactivated "

          for attempt in {1..60}; do
            deploy="$(
              curl --fail --silent --show-error \
                --header "authorization: Bearer ${RENDER_API_KEY}" \
                --header "accept: application/json" \
                "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${{ steps.deploy.outputs.deploy_id }}"
            )"
            status="$(echo "$deploy" | jq -r '.status // .deploy.status // empty')"

            echo "Render deploy status: ${status:-unknown} (attempt ${attempt}/60)"

            if [[ "$success_statuses" == *" ${status} "* ]]; then
              echo "Render deploy is live."
              exit 0
            fi

            if [[ "$failure_statuses" == *" ${status} "* ]]; then
              echo "Render deployment failed with status: ${status}"
              exit 1
            fi

            sleep 20
          done

          echo "Timed out waiting for Render deploy to become live."
          exit 1

      - name: Verify Render health endpoint
        run: |
          if [ -z "$RENDER_HEALTH_URL" ]; then
            echo "RENDER_HEALTH_URL is not set; Render readiness checks already gated traffic."
            exit 0
          fi

          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            "$RENDER_HEALTH_URL" > /dev/null

      - name: Rollback guidance
        if: failure()
        run: |
          echo "Backend deployment failed."
          echo "Render keeps the previous live instance serving if the new build/startup/health checks fail."
          echo "Use the Render dashboard or rollback API if production was promoted and needs to be restored."

  pipeline-status:
    name: Pipeline Status Check
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - frontend-ci
      - backend-test
      - backend-build
      - deploy-frontend
      - deploy-backend

    steps:
      - name: Check frontend CI status
        if: needs.changes.outputs.frontend == 'true' && needs['frontend-ci'].result != 'success'
        run: |
          echo "FRONTEND CI JOB FAILED"
          echo "Frontend lint/build must pass before Vercel deployment."
          exit 1

      - name: Check backend test status
        if: needs.changes.outputs.backend_ci == 'true' && needs['backend-test'].result != 'success'
        run: |
          echo "BACKEND TEST JOB FAILED"
          echo "Backend tests and coverage must pass before Render deployment."
          exit 1

      - name: Check backend build status
        if: needs.changes.outputs.backend == 'true' && needs['backend-build'].result != 'success'
        run: |
          echo "BACKEND BUILD JOB FAILED"
          echo "Backend build validation must pass before Render deployment."
          exit 1

      - name: Check frontend deployment status
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.frontend == 'true' && needs['deploy-frontend'].result != 'success'
        run: |
          echo "FRONTEND DEPLOYMENT FAILED"
          echo "Vercel deployment did not complete successfully."
          exit 1

      - name: Check backend deployment status
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.changes.outputs.backend == 'true' && needs['deploy-backend'].result != 'success'
        run: |
          echo "BACKEND DEPLOYMENT FAILED"
          echo "Render deployment did not complete successfully."
          exit 1

      - name: Pipeline Status Success
        run: |
          if [ "${{ needs.changes.outputs.frontend }}" != "true" ] && \
             [ "${{ needs.changes.outputs.backend_ci }}" != "true" ]; then
            echo "No frontend or backend changes detected; deployment jobs were intentionally skipped."
          else
            echo "All required checks for the changed application areas passed."
          fi
