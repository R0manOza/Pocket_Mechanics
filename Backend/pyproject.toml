[project]
name = "pocket-mechanics-api"
version = "0.1.0"
description = "Pocket Mechanics API — Lab 5 text-only AI endpoint"
requires-python = ">=3.11"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "google-generativeai>=0.8",
  "python-dotenv>=1.0",
  "pydantic>=2.7",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["models", "routers", "services"]

[tool.uv]
dev-dependencies = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]
